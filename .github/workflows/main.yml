name: 'GCP Fed Test'
on: [push]

permissions:
  contents: read
  id-token: 'write'

jobs:
  test-gcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - id: 'auth'
        name: 'Authincation to GCP'
        uses: 'google-github-actions/auth@v2' 
        with:
          workload_identity_provider: 'projects/882099283079/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-gcp@project-7cdc1739-86ea-4d27-ac3.iam.gserviceaccount.com'
          
      -  name: 'List Bucket'
         run: gcloud storage lit

         
